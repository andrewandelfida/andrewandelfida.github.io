<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      These static tags describe the DEFAULT language (Romanian). They are what a
      crawler, a link preview or a share sheet reads before any script runs, so
      they must match DEFAULT_LOCALE in src/i18n/locale.ts. Once the app boots,
      applyLocaleToDocument() rewrites them to whichever language is active.
    -->
    <title>Andrei și Elfida · 3 octombrie 2026</title>
    <meta
      name="description"
      content="Invitație la nunta lui Andrei și a Elfidei — 3 octombrie 2026, Biserica „Harul”, s. Stănești, regiunea Cernăuți."
    />
    <meta name="theme-color" content="#F7F3E9" />
    <link rel="canonical" href="https://andrewandelfida.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://andrewandelfida.github.io/" />
    <meta property="og:locale" content="ro" />
    <meta property="og:title" content="Andrei și Elfida · 3 octombrie 2026" />
    <meta
      property="og:description"
      content="Invitație la nunta lui Andrei și a Elfidei — 3 octombrie 2026, Biserica „Harul”, s. Stănești, regiunea Cernăuți."
    />
    <meta property="og:image" content="https://andrewandelfida.github.io/doves-olive.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/doves-olive.png" />

    <!--
      Preload the two faces that the first screen is built from.

      Each face is a single file subset to exactly the characters this site can
      render (see scripts/fetch-fonts.mjs), so the same file serves all three
      languages and there is nothing to branch on. Playfair carries the names —
      the largest contentful paint — and Montserrat the eyebrow and date.

      The italic and script faces are NOT preloaded: they first appear further
      down the page and would only compete for bandwidth here.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/playfair-display-normal.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/montserrat-normal.woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
